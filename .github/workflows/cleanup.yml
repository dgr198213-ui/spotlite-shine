name: Cleanup Branches

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const defaultBranch = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const branch of branches.data) {
              if (branch.name === defaultBranch.data.default_branch) {
                continue;
              }

              try {
                const compareCommits = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: defaultBranch.data.default_branch,
                  head: branch.name,
                });

                if (compareCommits.data.commits.length === 0) {
                  console.log(`Deleting merged branch: ${branch.name}`);
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branch.name}`,
                  });
                }
              } catch (error) {
                console.log(`Skipping branch ${branch.name}: ${error.message}`);
              }
            }
