<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none" role="img" aria-label="Telón">
  <defs>
    <linearGradient id="spotGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="50%" stop-color="#ffa500"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
  </defs>

  <!-- Spotlight Icon (foco de teatro) -->
  <g transform="translate(20, 15)">
    <!-- Main spotlight cone -->
    <path d="M40 0 L75 50 L65 90 L40 70 L15 90 L5 50 Z" fill="url(#spotGradient)" opacity="0.9"/>

    <!-- Star (estrella central) -->
    <path d="M40 28 L43 38 L53 38 L45 44 L48 54 L40 48 L32 54 L35 44 L27 38 L37 38 Z" fill="#ffd700"/>

    <!-- Stage curtains hint (cortinas de escenario) -->
    <path d="M10 70 Q20 65 30 70 Q40 65 50 70 Q60 65 70 70" stroke="#ffd700" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Sparkles (destellos) -->
    <circle cx="12" cy="18" r="2.5" fill="#fff"/>
    <circle cx="68" cy="12" r="2" fill="#ffd700"/>
    <circle cx="5" cy="40" r="1.5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Text "Telón" -->
  <text x="110" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="url(#goldGradient)" letter-spacing="-1">
    Telón
  </text>

  <!-- Tagline -->
  <text x="110" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a0a0c0" letter-spacing="2">
    ARTISTAS · EVENTOS · ESCENARIO
  </text>
</svg>
