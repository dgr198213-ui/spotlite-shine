<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtros de iluminación -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Degradados -->
    <linearGradient id="bg-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172F" />
      <stop offset="100%" stop-color="#03050A" />
    </linearGradient>

    <linearGradient id="blue-curtain-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0022AA" />
    </linearGradient>

    <linearGradient id="chrome-t-3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F0F4F8" />
      <stop offset="55%" stop-color="#D1D9E6" />
      <stop offset="100%" stop-color="#8A99AD" />
    </linearGradient>
  </defs>

  <!-- Fondo del Favicon (Caja redondeada estilo App) -->
  <rect width="500" height="500" x="6" y="6" rx="110" fill="url(#bg-frame)" stroke="#0044AA" stroke-width="4" />
  
  <!-- Marco interior de Neón Azul -->
  <rect width="490" height="490" x="11" y="11" rx="105" fill="none" stroke="#00F0FF" stroke-width="4" filter="url(#neon-glow)" opacity="0.8" />

  <!-- Gráficos de la "T" centrados en el marco -->
  <g transform="translate(40, 35)">
    <!-- Pliegues del TUESDI -->
    <path d="M 125,225 C 105,300 115,350 110,400 L 145,395 C 150,340 145,290 155,225 Z" fill="#002288" opacity="0.7" />
    <path d="M 150,200 C 120,290 140,360 120,420 L 165,415 C 185,350 170,270 185,200 Z" fill="url(#blue-curtain-main)" />
    <path d="M 180,185 C 160,260 215,350 180,420 L 225,410 C 250,340 210,260 220,185 Z" fill="url(#blue-curtain-main)" />

    <!-- Estructura de la "T" -->
    <path d="M 60,225 C 75,185 130,145 230,145 L 350,145 C 375,145 365,175 345,215 L 320,245 L 225,245 L 180,415 C 175,435 150,435 135,415 L 100,245 L 60,225 Z" fill="url(#chrome-t-3d)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 85,210 C 120,165 180,155 240,155 L 340,155" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#neon-glow)" opacity="0.6" />

    <!-- Botón de Play Neón -->
    <g transform="translate(145, 125)">
      <circle cx="160" cy="220" r="48" fill="#03091F" stroke="#00F0FF" stroke-width="6" filter="url(#neon-glow)" />
      <circle cx="160" cy="220" r="42" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
      <polygon points="146,198 184,220 146,242" fill="#FFFFFF" filter="url(#neon-glow)" opacity="0.9" />
      <polygon points="146,198 184,220 146,242" fill="#00F0FF" />
    </g>
  </g>
</svg>
